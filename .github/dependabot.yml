# Actions are pinned to commit SHAs with the tag in a trailing comment; this keeps the pins current.
# Majors are deliberate, so they are left out. The probes project's EF Core, Npgsql and Roslyn
# references are measurements (design/schemakit-core-plan.md, section 2), not dependencies to float.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: nuget
    directory: /test/CodoMetis.EFCore.SchemaKit.Tests
    schedule:
      interval: monthly
    groups:
      test-dependencies:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL*"

  # src/ has no version updates: its EF Core floor is a release decision. The entry exists so that
  # security updates there honour the same ignores.
  - package-ecosystem: nuget
    directories:
      - /src/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"

  - package-ecosystem: nuget
    directory: /test/SchemaKit.ApiProbes
    schedule:
      interval: monthly
    groups:
      test-dependencies:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL*"
      - dependency-name: "Microsoft.CodeAnalysis*"
