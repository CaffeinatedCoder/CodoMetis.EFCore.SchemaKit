# The one build workflow. Its last job, `CI`, needs every other job, runs `if: always()` and passes
# only when each of them reports `success`. It is the one check to require on `main`: GitHub
# reports a skipped job as Success even on a required check, so per-lane required checks cannot
# tell a skip from a pass. Add a lane to the gate's `needs` when you add the lane.
#
# The SDK comes from global.json. Actions are pinned to commit SHAs with the tag in a trailing
# comment; .github/dependabot.yml keeps the pins current.

name: .NET

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]

permissions:
  contents: read

jobs:
  # Compile probes for design/schemakit-api.md: each "does not compile" claim of the design,
  # compiled with Roslyn against the prototype and checked for its diagnostic, plus the prototype's
  # behaviour tests. Until the kernel exists this is the only code in the repository.
  probes:
    name: API probes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Compile probes
        run: >
          dotnet test test/SchemaKit.ApiProbes/SchemaKit.ApiProbes.csproj
          --logger "trx;LogFileName=probes.trx"
          --results-directory TestResults

  # Throwaway projects that answer one question of the plan each (design/schemakit-core-plan.md,
  # section 6). They run here so their answer is measured on the SDK global.json pins, not only on
  # the machine that wrote them. A spike leaves with the code that replaces it.
  spikes:
    name: Spikes
    runs-on: ubuntu-latest

    # For the spikes that write to a database. The image floats within its major on purpose, as a
    # consumer's server does.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: spike
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      SPIKE_PG: Host=localhost;Port=5432;Username=postgres;Password=spike;Database=spike_b

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Run every spike project
        run: |
          shopt -s nullglob
          for project in spikes/*/*.csproj; do
            echo "::group::$project"
            dotnet test "$project" --logger "trx;LogFileName=$(basename "$project" .csproj).trx" --results-directory TestResults
            echo "::endgroup::"
          done

      # A spike whose subject is delivery brings a script: it packs, restores into a project outside
      # the checkout and drives the real tools. Its table goes to the job summary.
      - name: Run every spike script
        run: |
          shopt -s nullglob
          status=0
          for script in spikes/*/run.sh; do
            spike=$(basename "$(dirname "$script")")
            echo "::group::$script"
            "$script" "$RUNNER_TEMP/$spike" || status=1
            echo "::endgroup::"
            {
              echo "### $spike"
              echo
              echo "| Consumer | Path | | Outcome |"
              echo "|---|---|---|---|"
              cat "$RUNNER_TEMP/$spike/results.md"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [ probes, spikes ]
    if: always()

    steps:
      # Reads `needs` whole rather than naming the jobs again, so a lane added to `needs` is checked
      # without a second edit here.
      - name: Every lane succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          rows="$(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<<"$NEEDS")"
          if [[ -z "$rows" ]]; then
            echo "::error::The gate needs no jobs, so it would pass on nothing."
            exit 1
          fi

          failed=0
          {
            echo "| Job | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r job result; do
            echo "| \`$job\` | $result |" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" != "success" ]]; then
              echo "::error::$job: $result. Every lane must succeed; a skipped or cancelled lane fails the gate too."
              failed=1
            fi
          done <<<"$rows"
          exit "$failed"
