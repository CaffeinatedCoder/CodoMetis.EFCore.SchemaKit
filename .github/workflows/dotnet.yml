# The one build workflow. Its last job, `CI`, needs every other job, runs `if: always()` and passes
# only when each of them reports `success`. It is the one check to require on `main`: GitHub
# reports a skipped job as Success even on a required check, so per-lane required checks cannot
# tell a skip from a pass. Add a lane to the gate's `needs` when you add the lane.
#
# The SDK comes from global.json. Actions are pinned to commit SHAs with the tag in a trailing
# comment; .github/dependabot.yml keeps the pins current.

name: .NET

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]

permissions:
  contents: read

jobs:
  # The kernel and its tests. No database but SQLite: models are built and scripts generated, and
  # EF Core's own design-time composition is driven in process. Built in Release with warnings as
  # errors, which is also what holds EF1001 (no EF-internal API in the shipping project). The tests
  # that need a server are the integration lane's.
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build CodoMetis.EFCore.SchemaKit.slnx -c Release

      - name: Test
        run: >
          dotnet test test/CodoMetis.EFCore.SchemaKit.Tests/CodoMetis.EFCore.SchemaKit.Tests.csproj
          -c Release --no-build
          --filter "TestCategory!=Integration"
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults

  # Statements run on a live server and judged by its catalog. The image floats within its major on
  # purpose, as a consumer's server does; its digest goes to the summary, so a failure with no diff
  # can be compared with the last green run. CI is set on every runner, which makes a missing
  # server fail these tests instead of leaving them inconclusive.
  integration:
    name: Integration (PostgreSQL 18)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: schemakit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      SCHEMAKIT_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=schemakit;Database=postgres

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Image digest
        run: |
          {
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`postgres:18\` | \`$(docker image inspect postgres:18 --format '{{index .RepoDigests 0}}')\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # A filter that matches nothing passes. The count is read back, so a renamed category cannot
      # retire the lane while it reports green.
      - name: Integration tests
        run: |
          dotnet test test/CodoMetis.EFCore.SchemaKit.Tests/CodoMetis.EFCore.SchemaKit.Tests.csproj \
            -c Release \
            --filter "TestCategory=Integration" \
            --logger "trx;LogFileName=integration.trx" \
            --results-directory TestResults | tee integration.log
          if ! grep -Eq 'Passed:[[:space:]]+[1-9]' integration.log; then
            echo "::error::No integration test ran."
            exit 1
          fi

  # Compile probes for design/schemakit-api.md: each "does not compile" claim of the design,
  # compiled with Roslyn against the prototype and checked for its diagnostic, plus the prototype's
  # behaviour tests. Until the kernel exists this is the only code in the repository.
  probes:
    name: API probes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Compile probes
        run: >
          dotnet test test/SchemaKit.ApiProbes/SchemaKit.ApiProbes.csproj
          --logger "trx;LogFileName=probes.trx"
          --results-directory TestResults

  # Throwaway projects that answer one question of the plan each (design/schemakit-core-plan.md,
  # section 6). They run here so their answer is measured on the SDK global.json pins, not only on
  # the machine that wrote them. A spike leaves with the code that replaces it.
  spikes:
    name: Spikes
    runs-on: ubuntu-latest

    # For the spikes that write to a database. The image floats within its major on purpose, as a
    # consumer's server does.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: spike
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      # Spike E measures on the oldest PostgreSQL SchemaKit supports as well, and on SQL Server.
      postgres16:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: spike
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Spike-E-2022x
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Spike-E-2022x -C -b -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    env:
      SPIKE_PG: Host=localhost;Port=5432;Username=postgres;Password=spike;Database=spike_b
      SPIKE_E_PG18: Host=localhost;Port=5432;Username=postgres;Password=spike;Database=postgres
      SPIKE_E_PG16: Host=localhost;Port=5433;Username=postgres;Password=spike;Database=postgres
      SPIKE_E_MSSQL: Server=localhost,1433;User Id=sa;Password=Spike-E-2022x;TrustServerCertificate=True
      SPIKE_E_OUT: ${{ runner.temp }}/spike-e

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Run every spike project
        run: |
          shopt -s nullglob
          for project in spikes/*/*.csproj; do
            echo "::group::$project"
            dotnet test "$project" --logger "trx;LogFileName=$(basename "$project" .csproj).trx" --results-directory TestResults
            echo "::endgroup::"
          done

      # Spike E's result is a table per server. It goes to the job summary whether the cells passed
      # or not: a cell that measured otherwise is exactly when the table is wanted.
      - name: Spike E, the impact table
        if: always()
        run: |
          shopt -s nullglob
          for table in "$SPIKE_E_OUT"/*.md; do
            cat "$table" | tee -a "$GITHUB_STEP_SUMMARY"
            echo | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # A spike whose subject is delivery brings a script: it packs, restores into a project outside
      # the checkout and drives the real tools. Its table goes to the job summary.
      - name: Run every spike script
        run: |
          shopt -s nullglob
          status=0
          for script in spikes/*/run.sh; do
            spike=$(basename "$(dirname "$script")")
            echo "::group::$script"
            "$script" "$RUNNER_TEMP/$spike" || status=1
            echo "::endgroup::"
            {
              echo "### $spike"
              echo
              echo "| Consumer | Path | | Outcome |"
              echo "|---|---|---|---|"
              cat "$RUNNER_TEMP/$spike/results.md"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [ test, integration, probes, spikes ]
    if: always()

    steps:
      # Reads `needs` whole rather than naming the jobs again, so a lane added to `needs` is checked
      # without a second edit here.
      - name: Every lane succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          rows="$(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<<"$NEEDS")"
          if [[ -z "$rows" ]]; then
            echo "::error::The gate needs no jobs, so it would pass on nothing."
            exit 1
          fi

          failed=0
          {
            echo "| Job | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r job result; do
            echo "| \`$job\` | $result |" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" != "success" ]]; then
              echo "::error::$job: $result. Every lane must succeed; a skipped or cancelled lane fails the gate too."
              failed=1
            fi
          done <<<"$rows"
          exit "$failed"
