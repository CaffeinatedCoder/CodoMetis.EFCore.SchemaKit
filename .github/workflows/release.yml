# Publish to NuGet when a v* tag is pushed. Ported from EFCore.ComplexIndexes.
#
# Directory.Build.props is the one source of the version: the tag is checked against it and does
# not drive it, so a mistyped tag fails before anything is pushed. The packages are found in the
# pack output, so a package added under src/ is published without an edit here.
#
#   git tag v11.0.0-preview.1 && git push origin v11.0.0-preview.1
#
# A version with a suffix (11.0.0-preview.1) is a prerelease on nuget.org by its version alone,
# and the GitHub release is marked a prerelease and never Latest.
#
# Publishing uses Trusted Publishing (OIDC): no long-lived API key exists in this repository.
# GitHub signs a short-lived token that says which workflow of which repository is running,
# nuget.org checks it against a policy configured there and issues an API key valid for one hour.
#
# First the whole of CI: the `ci` job calls dotnet.yml, so every lane a pull request runs is run
# again on the tagged commit, and its `CI` gate fails on a lane that failed, was skipped or was
# cancelled. `verify` needs it, so nothing is packed, approved or published before it passes.
#
# Then three jobs on purpose. Everything that can fail runs unattended in `verify`; only the push
# waits behind the environment's approval; the GitHub release is created afterwards. The job that
# can mint a token cannot write to the repository, and the job that can write to the repository
# cannot mint a token.
#
# Actions are pinned to commit SHAs with the tag in a trailing comment, which is what Dependabot
# reads. This is the publish path, and NuGet/login runs in the one job that can mint a token.
#
# What has to exist outside this file (issue 14):
#   1. The environment `nuget`, with a required reviewer and deployments from tags `v*` only.
#   2. On nuget.org, a Trusted Publishing policy naming this repository's owner and name, the
#      workflow's file name (release.yml, not a path) and the environment `nuget`.
#   3. The secret NUGET_USER in that environment: the nuget.org profile name, not the email
#      address. It is no credential; it is a secret to keep it out of the logs.
#
# Before the first tag, CHANGELOG.md needs a section headed `## [x.y.z] — yyyy-mm-dd` for the
# version (CONTRIBUTING.md, Changelog). `verify` fails a tag without one, and its text becomes the
# GitHub release's notes.

name: Release

on:
  push:
    tags: [ "v*" ]
  # TEMPORARY, for one run on the pull request: exercises ci and verify. To be removed before merge.
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test, pack and check the packages, but push nothing to NuGet"
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  # Every lane of dotnet.yml, behind its `CI` job. A reusable workflow and not a copy, so a lane
  # added there gates a release without an edit here. Read-only, like every job before `publish`.
  ci:
    name: CI
    uses: ./.github/workflows/dotnet.yml
    permissions:
      contents: read

  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read   # no id-token here on purpose: nothing in this job may mint a token

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # MSBuild's evaluation and not the XML's text, so the value is what the build stamps onto
      # the packages.
      - name: Resolve version
        id: version
        run: |
          version="$(dotnet msbuild src/CodoMetis.EFCore.SchemaKit/CodoMetis.EFCore.SchemaKit.csproj -getProperty:Version)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not evaluate the Version property."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: The tag is the package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" != "$VERSION" ]]; then
            echo "::error::Tag v$tag is not the version in Directory.Build.props ($VERSION). Set the version and tag again; a version nothing documents is not published."
            exit 1
          fi

      # The release's notes are the version's section of CHANGELOG.md: the lines after its
      # `## [x.y.z] — yyyy-mm-dd` heading up to the next `## `, from the first line with text.
      # They are written here, before anything is published, and travel with the packages: a tag
      # whose version has no section fails now and not after the push. A dry run from a branch
      # whose changelog has no section yet goes on with a warning, so the rest can be exercised.
      #
      # index() and not a regex, so the dots of the version match only dots. The changelog links
      # this repository at main, which moves on after the tag; the notes link it at the tag.
      - name: Release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          mkdir -p dist
          notes="$(awk -v heading="## [$VERSION] " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found && (started || NF) { started = 1; print }
          ' CHANGELOG.md)"

          for kind in blob tree; do
            main="$REPO_URL/$kind/main/"
            frozen="$REPO_URL/$kind/v$VERSION/"
            notes="${notes//"$main"/$frozen}"
          done

          if [[ -z "$notes" ]]; then
            message="CHANGELOG.md has no section '## [$VERSION] — yyyy-mm-dd' with text in it."
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::$message It is the release's notes; add it and tag again."
              exit 1
            fi
            echo "::warning::$message A tag for $VERSION would stop here."
            notes="(dry run: no changelog section for $VERSION)"
          elif ! grep -Eq "^## \[${VERSION//./\\.}\] — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::The heading of $VERSION in CHANGELOG.md is not '## [$VERSION] — yyyy-mm-dd'."
            exit 1
          fi

          printf '%s\n' "$notes" > dist/release-notes.md
          cat dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: dotnet build CodoMetis.EFCore.SchemaKit.slnx -c Release

      - name: Pack
        run: dotnet pack CodoMetis.EFCore.SchemaKit.slnx -c Release --no-build -o dist

      # The pack checks, on the packages that are about to be published and not on a second pack
      # of the same commit: the kernel dependency exact, a README and symbols in each, license,
      # repository, commit and framework. SCHEMAKIT_PACKAGES makes PackagingConventionTests read
      # the folder. A filter that matches nothing passes, so the count is read back.
      - name: Pack checks
        env:
          SCHEMAKIT_PACKAGES: ${{ github.workspace }}/dist
        run: |
          dotnet test test/CodoMetis.EFCore.SchemaKit.Tests/CodoMetis.EFCore.SchemaKit.Tests.csproj \
            -c Release --no-build \
            --filter "ClassName~PackagingConventionTests" | tee pack-checks.log
          if ! grep -Eq 'Passed:[[:space:]]+[1-9]' pack-checks.log; then
            echo "::error::No pack check ran."
            exit 1
          fi

      # One package and one symbols package per project under src/, at the version, and nothing
      # else: what is uploaded here is what `publish` pushes.
      - name: Collect packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          status=0
          for directory in src/*/; do
            id="$(basename "$directory")"
            for extension in nupkg snupkg; do
              if [[ ! -f "dist/$id.$VERSION.$extension" ]]; then
                echo "::error::dist/ has no $id.$VERSION.$extension."
                status=1
              fi
            done
          done
          packages=(dist/*.nupkg)
          projects=(src/*/)
          if [[ ${#packages[@]} -ne ${#projects[@]} ]]; then
            echo "::error::dist/ holds ${#packages[@]} packages for ${#projects[@]} projects under src/: ${packages[*]##*/}"
            status=1
          fi
          {
            echo "### Packed $VERSION"
            echo
            for file in dist/*.nupkg dist/*.snupkg; do
              echo "- \`$(basename "$file")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            dist/*.nupkg
            dist/*.snupkg
            dist/release-notes.md

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: verify

    # A tag push, or a manual run that says it is no dry run. Any other event skips the job, so
    # no approval is asked for and no token is minted. Written as what is allowed, not as what is
    # excluded: an event added to `on:` later publishes nothing by default. The environment
    # refuses a ref that is no `v*` tag besides.
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}

    # The approval gate. Must be the environment the nuget.org policy names.
    environment: nuget

    permissions:
      contents: read
      id-token: write   # lets GitHub mint the OIDC token nuget.org validates

    # No checkout, so no global.json: this job pushes what `verify` built, and any 11.0 SDK does.
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 11.0.x

      # Publishes what was verified: nothing is built here.
      - name: Download packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nupkg-${{ needs.verify.outputs.version }}
          path: dist

      - name: The publisher's name is configured
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [[ -z "${NUGET_USER:-}" ]]; then
            echo "::error::The NUGET_USER secret is not set. It is the nuget.org profile name, not the email address."
            exit 1
          fi

      # Exchanges this run's OIDC token for an API key nuget.org issues against the policy, valid
      # for one hour. Nothing is stored.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Only .nupkg is named: `dotnet nuget push` uploads the .snupkg beside it. The kernel goes
      # first, since the PostgreSQL package depends on exactly this version of it.
      #
      # --skip-duplicate makes a second run after a partial failure safe: what is published
      # already is reported and passed over. The key expires an hour after the login, so a run
      # repeated much later needs a new workflow run.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          shopt -s nullglob
          packages=(dist/*."$VERSION".nupkg)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error::No *.$VERSION.nupkg in the downloaded artifact."
            exit 1
          fi
          # Shortest name first: the kernel's id is a prefix of every other package's.
          IFS=$'\n' sorted=($(printf '%s\n' "${packages[@]}" | awk '{ print length($0) "\t" $0 }' | sort -n | cut -f2-))
          unset IFS
          for package in "${sorted[@]}"; do
            echo "==> Pushing $(basename "$package")"
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate
          done

      - name: Summary
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          {
            echo "### Released $VERSION"
            echo
            for package in dist/*."$VERSION".nupkg; do
              echo "- \`$(basename "$package")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # The GitHub release, created when it does not exist yet, with the notes `verify` took from the
  # changelog. A release written by hand before the tag was pushed is left as it is. Either way
  # the packages are on nuget.org by now: a failure here is loud and costs a manual step.
  #
  # No package is attached. nuget.org signs every package on ingestion, so the one downloaded
  # from there differs byte for byte from the one built here, and attaching ours would invite a
  # hash comparison that fails for no fault. The SBOMs EFCore.ComplexIndexes attaches come with the
  # rest of the port (issue 35).
  #
  # Apart from `publish` on purpose: that job holds id-token: write, this one contents: write,
  # and no job holds both.
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [ verify, publish ]

    # Tag pushes and manual runs on a tag. A run from a branch has no tag to release against.
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write   # creates the release; no id-token, on purpose

    steps:
      - name: Download packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nupkg-${{ needs.verify.outputs.version }}
          path: dist

      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tag="$GITHUB_REF_NAME"

          # "Not found" is the one failure that means "create it". Anything else (auth, the API)
          # must not be taken for it, or a release that exists gets a second attempt.
          if gh release view "$tag" --json tagName >/dev/null 2>view.err; then
            echo "Release $tag exists; its notes stay as written."
            exit 0
          elif ! grep -q "release not found" view.err; then
            cat view.err
            echo "::error::Could not tell whether release $tag exists."
            exit 1
          fi

          if [[ ! -s dist/release-notes.md ]]; then
            echo "::error::The artifact holds no release notes; the step in verify did not write them."
            exit 1
          fi

          {
            cat dist/release-notes.md
            printf '\nPublished to nuget.org through Trusted Publishing by [this run](%s).\n' "$RUN_URL"
          } > release-notes.md

          # Latest is decided here and not left to the API, which marks every new release Latest.
          # A version with a suffix is a prerelease and never Latest. With no tag,
          # `gh release view` shows the current Latest, which is never a prerelease; a release
          # older than it (a patch of an earlier minor) must not take its place.
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            echo "Publishing $tag as a prerelease, not Latest."
            flags+=(--prerelease --latest=false)
          else
            latest="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
            if [[ -n "$latest" && "$(printf '%s\n' "${latest#v}" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]]; then
              echo "Release $latest is newer; publishing $tag without marking it Latest."
              flags+=(--latest=false)
            fi
          fi

          gh release create "$tag" --verify-tag --title "$tag" --notes-file release-notes.md "${flags[@]}"
