# Every lane, every night, with nothing pushed. Ported from EFCore.ComplexIndexes.
#
# Some of CI's inputs change without a diff: the postgres:16, postgres:18 and
# mssql/server:2022-latest images float within their version, the consumer smoke test restores
# EF Core and Npgsql from nuget.org, and the SDK takes the latest patch of the band global.json
# names. In a week without a pull request nothing else would run CI, so such a change would
# surface in the middle of an unrelated fix, or on release day.
#
# One part. `main` calls dotnet.yml on the default branch, which is the only branch a schedule
# runs on and the only line there is (CONTRIBUTING.md, Branches and releases). A branch that ships
# a line of its own would need a job that dispatches dotnet.yml on it and waits for the run; the
# report below sees whatever jobs this file has.
#
# A failure opens an issue, or comments on the one that is open, and does not rely on GitHub's
# emails. Those reach only the user who last edited the cron line, and only under their own
# notification settings. An issue reaches whoever watches the repository and stays until closed.
#
# GitHub turns schedules off in a public repository after 60 days without activity, so nothing may
# depend on this workflow: release.yml runs the whole of CI itself before it publishes.

name: Nightly

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main:
    name: Every lane on main
    uses: ./.github/workflows/dotnet.yml
    permissions:
      contents: read

  # Runs after every other job whatever it did, and opens or updates the issue when one did not
  # succeed. A skipped or cancelled job counts as a failure here, as in dotnet.yml's gate.
  # CiInputConventionTests holds that every job of this file is in `needs`.
  report:
    name: Report a failure
    runs-on: ubuntu-latest
    needs: [ main ]
    if: always()
    permissions:
      issues: write

    steps:
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failures="$(jq -r 'to_entries[] | select(.value.result != "success") | "- `\(.key)`: \(.value.result)"' <<<"$NEEDS")"
          if [[ -z "$failures" ]]; then
            echo "Every part of the nightly run succeeded."
            exit 0
          fi

          title="Nightly CI failed"
          body="$(printf 'The nightly run on %s failed: %s\n\n%s\n\nNothing was pushed, so the cause is an input that changes without a diff: a container image, a package on nuget.org, or the SDK patch level. The integration and the smoke lanes write the image digests they ran on into their summaries.' \
            "$(date -u +%F)" "$RUN_URL" "$failures")"

          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label chore --label area/release --body "$body"
          fi

          echo "::error::The nightly run failed:"$'\n'"$failures"
          exit 1
